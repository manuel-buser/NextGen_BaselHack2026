; Find my Bike Slot - snapshot firmware (motion trigger + push upload)
; Build/flash:  pio run -t upload -j 2      Monitor:  pio device monitor
[platformio]
src_dir = .

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = +<*> -<.pio/>
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; XIAO ESP32S3 native USB (VID:PID 303A:1001)
upload_port = COM8
monitor_port = COM8
