; Find my Bike Slot - camera firmware with on-device AI person blurring (ESP-IDF + ESP-DL)
; Build/flash:  pio run -t upload -j 2      Monitor:  pio device monitor
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; embeds the AI model (PlatformIO skips the component's CMake step for it)
extra_scripts = pre:gen_model.py
; XIAO ESP32S3 native USB (VID:PID 303A:1001)
upload_port = COM8
monitor_port = COM8
