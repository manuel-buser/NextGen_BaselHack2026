# One entry per camera-covered rack; the id is what the camera node and the detector use.
# location: the centre of the rack plan on the map.
# layout: rows and cols of spaces; bearing in degrees clockwise from north (along a row from space 1 to the last);
# entrance "start" (default) or "end" (the end people arrive from); space_m [along the row, depth] in metres
# (default [0.7, 1.9]). Spaces are numbered from the entrance along the bearing, row by row, row 1 on the left
# looking along the bearing; the detector's slot ids must follow this. Odd racks list spaces: [{id, x, y, w, h}, ...]
# in grid units instead of rows/cols.
# camera: the app polls the node instead of waiting for its posts (pull mode, see README):
# {url: "http://192.168.21.95"} with optional status_path, picture_path, poll_s, picture_every_s.
# group: racks with the same group are one location on the user page (one pin, one entry, their total).
# Here: four sections of hanging bike spaces on the north side of the Peter Merian-Weg cycle path, numbered
# eastwards from the west corner of the Peter Merian building, 3 m apart.
racks:
  - id: A1
    name: Peter Merian-Weg 1
    group: Peter Merian-Weg
    capacity: 10
    location: {lat: 47.546174, lng: 7.593798}
    layout: {rows: 1, cols: 10, bearing: 118, space_m: [0.5, 1.2]}
  - id: A2
    name: Peter Merian-Weg 2
    group: Peter Merian-Weg
    capacity: 19
    location: {lat: 47.546131, lng: 7.593918}
    layout: {rows: 1, cols: 19, bearing: 118, space_m: [0.5, 1.2]}
  - id: A3
    name: Peter Merian-Weg 3
    group: Peter Merian-Weg
    capacity: 19
    location: {lat: 47.546078, lng: 7.594065}
    layout: {rows: 1, cols: 19, bearing: 118, space_m: [0.5, 1.2]}
  - id: A4
    name: Peter Merian-Weg 4
    group: Peter Merian-Weg
    capacity: 19
    location: {lat: 47.546026, lng: 7.594212}
    layout: {rows: 1, cols: 19, bearing: 118, space_m: [0.5, 1.2]}
