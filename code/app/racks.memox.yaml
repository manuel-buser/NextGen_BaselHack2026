# Set-up for the pitch on 2026-11-01: one real camera at Memox, Elisabethenstrasse 15, 4051 Basel.
# The wall rack in front of the building has four bays between concrete pillars, counted on 2026-10-31:
# bay 1 with 10 hooks, then bays 2, 3 and 4 with 19 hooks each (67 in all). The camera films bay 2. The vision
# service on the vision laptop (code/bikeslot) fetches its pictures itself, decides free or taken per hook and
# the app reads the decided spaces: rack MX-CAM, block `vision` (README, "Live rack from the vision service").
# Bays 1, 3 and 4 and the racks at the other addresses around are made up (demo: true), fed by
# tools/demo_data.py and labelled "Demo data" on the pages.
#
# Start (app next to the vision service on the same laptop, which has port 8000):
#   BIKESLOT_RACKS=racks.memox.yaml uv run uvicorn bikeslot.main:app --host 0.0.0.0 --port 8080
#   uv run python tools/demo_data.py --app http://127.0.0.1:8080 --inactive none --warmup 7
#
# Coordinates from OpenStreetMap (Nominatim, 2026-10-31). Still guesses: the bearing of the wall (196 = along
# Elisabethenstrasse towards Basel SBB), on which side of the camera bay 1 lies (here: north), and the layouts of
# the other addresses. The bays are placed about 1.8 times their real distance apart so the map pins stay
# readable; the real wall is continuous. Hook numbering: space 1 is the leftmost hook in the camera picture. If
# the plan on the map runs the wrong way, add 180 to the bearing (or set entrance: end).
racks:
  - id: MX-1
    name: Memox, bay 1 (10 hooks)
    capacity: 10
    location: {lat: 47.553087, lng: 7.591822}
    layout: {rows: 1, cols: 10, bearing: 196, space_m: [0.5, 1.2]}
    demo: true
  - id: MX-CAM
    name: Memox, bay 2 (camera)
    capacity: 19
    location: {lat: 47.552966, lng: 7.591770}
    layout: {rows: 1, cols: 19, bearing: 196, space_m: [0.5, 1.2]}
    # url = the vision laptop (its service listens on 8000), camera = the camera id there (BIKESLOT_PULL_CAMERAS,
    # live01 by default). The laptop's address changes with the network: check it before the demo (ipconfig) and
    # open port 8000 in its firewall. Leave url out when the service pushes instead (BIKESLOT_APP_URL on the
    # laptop), for example when this app runs on a server the laptop can reach but that cannot reach the laptop.
    vision: {url: "http://192.168.21.88:8000", camera: live01}
  - id: MX-3
    name: Memox, bay 3
    capacity: 19
    location: {lat: 47.552810, lng: 7.591704}
    layout: {rows: 1, cols: 19, bearing: 196, space_m: [0.5, 1.2]}
    demo: true
  - id: MX-4
    name: Memox, bay 4
    capacity: 19
    location: {lat: 47.552654, lng: 7.591638}
    layout: {rows: 1, cols: 19, bearing: 196, space_m: [0.5, 1.2]}
    demo: true
  - id: THEATER
    name: Theater Basel, Theaterplatz
    capacity: 20
    location: {lat: 47.552739, lng: 7.590148}
    layout: {rows: 2, cols: 10, bearing: 100}
    demo: true
  - id: AESCHEN
    name: Aeschenplatz
    capacity: 24
    location: {lat: 47.551753, lng: 7.596508}
    layout: {rows: 2, cols: 12, bearing: 60}
    demo: true
  - id: SBB
    name: Basel SBB, Centralbahnplatz
    capacity: 40
    location: {lat: 47.548089, lng: 7.590182}
    layout: {rows: 2, cols: 20, bearing: 95}
    demo: true
  - id: KUNSTMUSEUM
    name: Kunstmuseum, St. Alban-Graben
    capacity: 14
    location: {lat: 47.553929, lng: 7.594451}
    layout: {rows: 1, cols: 14, bearing: 30}
    demo: true
  - id: ANLAGE
    name: Elisabethenanlage
    capacity: 10
    location: {lat: 47.549328, lng: 7.589074}
    layout: {rows: 1, cols: 10, bearing: 150}
    demo: true
