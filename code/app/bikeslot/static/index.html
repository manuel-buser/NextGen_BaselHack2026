<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find my Bike Slot</title>
  <script src="/static/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/static/user.css">
</head>
<body>
  <div class="app">
    <header class="hdr enter">
      <div class="hdr__brand">
        <div class="badge">
          <svg class="badge__mark" viewBox="0 0 28 28" aria-hidden="true"><rect class="ink" x="0" y="18" width="10" height="10" rx="2.5"/><rect class="ink" x="9" y="9" width="10" height="10" rx="2.5"/><rect class="blue" x="18" y="0" width="10" height="10" rx="2.5"/></svg>
          <div class="badge__text">
            <span class="badge__name">NextGen</span>
            <span class="badge__sub">Endress+Hauser challenge at BaselHack 2026</span>
          </div>
        </div>
        <span class="hdr__rule" aria-hidden="true"></span>
        <div class="hdr__title">
          <p class="eyebrow">Bike parking</p>
          <h1 class="title">Find my Bike Slot</h1>
        </div>
      </div>
      <div class="hdr__tools">
        <button type="button" class="hdr__theme" id="theme-toggle" aria-label="Switch to dark mode"><svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12.8A8.5 8.5 0 1 1 11.2 3.5a7 7 0 0 0 9.3 9.3z"/></svg><svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
        <a class="hdr__admin" href="/admin"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>Admin</a>
      </div>
    </header>
    <main class="app__main">
      <section class="map enter" aria-label="Map of bike racks">
        <div id="map" class="map__canvas"></div>
        <div class="map-key" id="map-key" role="group" aria-label="Map key" hidden>
          <span class="map-key__i"><span class="pin"></span>Free</span>
          <span class="map-key__i"><span class="pin pin--full"></span>Full</span>
          <span class="map-key__i"><span class="pin pin--none"></span>No data</span>
        </div>
      </section>
      <section class="pane" aria-label="Free spaces and racks">
        <div class="pane__scroll">
          <section class="summary enter" id="hero" style="--i: 1" aria-labelledby="sum-h" aria-busy="true">
            <span class="sk" style="width: 64px; height: 12px"></span>
            <span class="sk" style="width: 64px; height: 84px; margin-top: 16px; border-radius: 10px"></span>
            <span class="sk" style="width: 190px; height: 14px; margin-top: 18px"></span>
            <span class="sk" style="width: 100%; height: 48px; margin-top: 20px; border-radius: 10px"></span>
          </section>
          <div class="list-head enter" style="--i: 2">
            <h2 class="eyebrow">Racks</h2>
            <span class="list-head__n" id="rack-count"></span>
          </div>
          <ul class="list" id="racks" aria-busy="true">
            <li><div class="tile tile--sk enter" style="--i: 3"><div class="tile__head"><span class="sk" style="width: 168px; height: 16px; margin: 3px 0"></span><span class="sk" style="width: 58px; height: 24px; border-radius: 999px; justify-self: end"></span><span class="sk" style="width: 92px; height: 26px; margin: 3px 0"></span><span></span><span class="sk" style="grid-column: 1 / -1; height: 4px; border-radius: 2px"></span><span class="sk" style="width: 96px; height: 10px; margin: 3px 0"></span></div></div></li>
            <li><div class="tile tile--sk enter" style="--i: 4"><div class="tile__head"><span class="sk" style="width: 196px; height: 16px; margin: 3px 0"></span><span class="sk" style="width: 58px; height: 24px; border-radius: 999px; justify-self: end"></span><span class="sk" style="width: 92px; height: 26px; margin: 3px 0"></span><span></span><span class="sk" style="grid-column: 1 / -1; height: 4px; border-radius: 2px"></span><span class="sk" style="width: 96px; height: 10px; margin: 3px 0"></span></div></div></li>
            <li><div class="tile tile--sk enter" style="--i: 5"><div class="tile__head"><span class="sk" style="width: 132px; height: 16px; margin: 3px 0"></span><span class="sk" style="width: 58px; height: 24px; border-radius: 999px; justify-self: end"></span><span class="sk" style="width: 92px; height: 26px; margin: 3px 0"></span><span></span><span class="sk" style="grid-column: 1 / -1; height: 4px; border-radius: 2px"></span><span class="sk" style="width: 96px; height: 10px; margin: 3px 0"></span></div></div></li>
          </ul>
        </div>
        <footer class="pane__foot">
          <span class="info info--up"><button type="button" class="info__btn" aria-label="Privacy" aria-expanded="false" aria-describedby="privacy-note"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l1.5-2.5h5L16 7h3.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-9A1.5 1.5 0 0 1 4.5 7z"/><circle cx="12" cy="13" r="3.25"/><path d="M3 3l18 18"/></svg></button><span class="info__pop" id="privacy-note">Only counts are kept. No pictures are stored.</span></span>
          <p class="foot__item"><svg class="ico" id="refresh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5v4h-4"/></svg><span id="updated">Waiting for the first update</span></p>
        </footer>
      </section>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
