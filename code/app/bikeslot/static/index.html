<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find my Bike Slot</title>
  <script src="/static/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/static/user.css">
</head>
<body>
  <div class="app">
    <header class="hdr enter">
      <div class="hdr__brand">
        <div class="badge">
          <svg class="badge__mark" viewBox="0 0 28 28" aria-hidden="true"><rect class="ink" x="0" y="18" width="10" height="10" rx="2.5"/><rect class="ink" x="9" y="9" width="10" height="10" rx="2.5"/><rect class="blue" x="18" y="0" width="10" height="10" rx="2.5"/></svg>
          <div class="badge__text">
            <span class="badge__name">NextGen</span>
            <span class="badge__sub">Endress+Hauser challenge at BaselHack 2026</span>
          </div>
        </div>
        <span class="hdr__rule" aria-hidden="true"></span>
        <div class="hdr__title">
          <p class="eyebrow">Bike parking</p>
          <h1 class="title">Find my Bike Slot</h1>
        </div>
      </div>
      <div class="hdr__tools">
        <button type="button" class="hdr__theme" id="theme-toggle" aria-label="Switch to dark mode"><svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12.8A8.5 8.5 0 1 1 11.2 3.5a7 7 0 0 0 9.3 9.3z"/></svg><svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
        <a class="hdr__admin" href="/admin"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>Admin</a>
      </div>
    </header>
    <main class="app__main">
      <section class="map enter" aria-label="Map of bike parkings">
        <div id="map" class="map__canvas"></div>
        <!-- The overview: free spaces over all bike parkings, on the map from the first moment -->
        <section class="overview enter" id="hero" style="--i: 1" aria-labelledby="sum-h">
          <div class="overview__body" id="hero-body" aria-busy="true">
            <span class="sk" style="width: 64px; height: 12px"></span>
            <span class="sk" style="width: 72px; height: 62px; margin-top: 10px; border-radius: 10px"></span>
            <span class="sk" style="width: 100%; height: 14px; margin-top: 12px"></span>
            <span class="sk" style="width: 100%; height: 44px; margin-top: 14px; border-radius: 10px"></span>
          </div>
          <footer class="overview__foot">
            <p class="foot__item"><svg class="ico" id="refresh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5v4h-4"/></svg><span id="updated">Waiting for the first update</span></p>
            <span class="info"><button type="button" class="info__btn" aria-label="Privacy" aria-expanded="false" aria-describedby="privacy-note"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l1.5-2.5h5L16 7h3.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-9A1.5 1.5 0 0 1 4.5 7z"/><circle cx="12" cy="13" r="3.25"/><path d="M3 3l18 18"/></svg></button><span class="info__pop" id="privacy-note">Only counts are kept. No pictures are stored.</span></span>
          </footer>
        </section>
        <div class="map-key" id="map-key" role="group" aria-label="Map key" hidden>
          <span class="map-key__i"><span class="pin"></span>Free</span>
          <span class="map-key__i"><span class="pin pin--full"></span>Full</span>
          <span class="map-key__i"><span class="pin pin--none"></span>No data</span>
        </div>
      </section>
    </main>
  </div>

  <!-- One bike parking, opened from its pin: the rack drawn with its spaces, and below it the day's statistics -->
  <dialog class="popup" id="popup" aria-labelledby="popup-name">
    <header class="popup__head">
      <div class="popup__title"><h2 class="popup__name" id="popup-name"></h2><span class="popup__chips" id="popup-chips"></span></div>
      <button type="button" class="popup__close" id="popup-close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <p class="count" id="popup-count"><span class="count__n"></span><span class="count__of"></span></p>
      <p class="popup__meta" id="popup-meta"></p>
    </header>
    <div class="popup__body">
      <section class="panel" aria-labelledby="spaces-h">
        <h3 class="eyebrow" id="spaces-h">Spaces</h3>
        <div class="blocks" id="popup-spaces"></div>
      </section>
      <section class="panel forecast" id="forecast" aria-label="Free spaces through the day" data-state="loading"><p class="forecast-quiet">Loading predictions</p></section>
    </div>
  </dialog>

  <!-- Shared drawing parts for the rack scenes: the wall and floor shading and the bicycle that hangs from a taken
       hook (front wheel on the hook at the origin, the rear wheel 118 units below, saddle and handlebar to the right) -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="scene-wall-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="wall-top"/><stop offset="1" class="wall-bottom"/></linearGradient>
      <linearGradient id="scene-floor-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="floor-top"/><stop offset="1" class="floor-bottom"/></linearGradient>
      <g id="bike">
        <g class="bike-wheel">
          <circle class="bike-tyre" cx="0" cy="17" r="17"/>
          <circle class="bike-rim" cx="0" cy="17" r="13"/>
          <path class="bike-spoke" d="M-13 17h26M0 4v26M-9.2 7.8l18.4 18.4M9.2 7.8l-18.4 18.4"/>
          <circle class="bike-hub" cx="0" cy="17" r="2.4"/>
        </g>
        <g class="bike-wheel">
          <circle class="bike-tyre" cx="0" cy="101" r="17"/>
          <circle class="bike-rim" cx="0" cy="101" r="13"/>
          <path class="bike-spoke" d="M-13 101h26M0 88v26M-9.2 91.8l18.4 18.4M9.2 91.8l-18.4 18.4"/>
          <circle class="bike-hub" cx="0" cy="101" r="2.4"/>
        </g>
        <path class="bike-frame" d="M34 77L32.3 31L-4.3 67ZM0 101L-4.3 67M0 101L34 77M32.3 31L0 17M32.3 31L37.4 21M34 77L40 80"/>
        <circle class="bike-ring" cx="-4.3" cy="67" r="6"/>
        <path class="bike-crank" d="M-4.3 67L2.5 73.5"/>
        <path class="bike-saddle" d="M40.8 71v18"/>
        <circle class="bike-grip" cx="37.4" cy="21" r="2.4"/>
      </g>
    </defs>
  </svg>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
