[project]
name = "bikeslot-app"
version = "0.1.0"
description = "Find my Bike Slot: server, user page and admin page (BaselHack 2026, team NextGen)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.47",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["ui: browser tests (need Playwright's Chromium)"]
